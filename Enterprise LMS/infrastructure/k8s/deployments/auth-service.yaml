apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: enterprise-lms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: enterprise-lms/auth-service:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: lms-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: enterprise-lms
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
