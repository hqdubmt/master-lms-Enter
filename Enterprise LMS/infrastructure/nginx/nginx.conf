upstream web         { server localhost:3000; }
upstream auth        { server localhost:3001; }
upstream learning    { server localhost:3002; }
upstream ai          { server localhost:3003; }
upstream analytics   { server localhost:3004; }
upstream notification { server localhost:3005; }
upstream game        { server localhost:3006; }
upstream media       { server localhost:3007; }
upstream realtime    { server localhost:3008; }

server {
    listen 80;
    server_name _;

    # Frontend
    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Auth Service
    location /api/auth/ {
        proxy_pass http://auth/;
    }

    # Learning Service
    location /api/learning/ {
        proxy_pass http://learning/;
    }

    # AI Service
    location /api/ai/ {
        proxy_pass http://ai/;
    }

    # Analytics
    location /api/analytics/ {
        proxy_pass http://analytics/;
    }

    # Notifications
    location /api/notifications/ {
        proxy_pass http://notification/;
    }

    # Gamification
    location /api/game/ {
        proxy_pass http://game/;
    }

    # Media
    location /api/media/ {
        proxy_pass http://media/;
        client_max_body_size 500M;
    }

    # Realtime WebSocket
    location /ws {
        proxy_pass http://realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
